<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b7285"><title>Sinfdoshlar V3</title>
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f8;color:#17202a}
header{position:sticky;top:0;z-index:5;background:#0b7285;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}.small{font-size:12px;opacity:.85}.wrap{max-width:760px;margin:auto;padding:12px}
.card{background:white;border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 2px 10px #0000000c}
button,input,select{font:inherit;border-radius:11px;border:1px solid #ccd6d9;padding:10px;background:white}
button{background:#0b7285;color:white;border:0;font-weight:700}.danger{background:#c92a2a}.muted{background:#e9eef0;color:#263238}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hidden{display:none}.pill{padding:7px 10px;border-radius:99px;font-size:12px;font-weight:700;display:inline-block}
.free{background:#d3f9d8;color:#216e2b}.busy{background:#ffe3e3;color:#a61e1e}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #edf0f1;padding:9px 0}
.item:last-child{border-bottom:0}.price{font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0}.tabs button{white-space:nowrap}.tabs .muted{background:#fff;border:1px solid #ccd6d9}
.total{font-size:19px;font-weight:900}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(420px,100%);background:white;border-radius:20px;padding:22px;box-shadow:0 8px 35px #0001}.code{font-size:28px;text-align:center;letter-spacing:8px;width:100%}
.notice{padding:10px;border-radius:10px;background:#fff3bf;margin:8px 0;font-size:13px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let me=null, db=null, cart=[], selectedPlace=null, cat="Baliq";
const app=document.getElementById("app");
const money=n=>new Intl.NumberFormat("uz-UZ").format(Math.round(n))+" so‘m";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||"Xatolik");return j}
function login(){app.innerHTML=`<div class="login"><div class="loginbox"><h1>🐟 Sinfdoshlar</h1><p>Telefon uchun boshqaruv dasturi</p><input id="code" class="code" inputmode="numeric" maxlength="4" placeholder="KOD"><br><br><button style="width:100%" onclick="doLogin()">Kirish</button><p class="small">Kodni hech kimga bermang.</p></div></div>`}
async function doLogin(){try{me=(await api("/api/login",{code:document.getElementById("code").value})).user;render()}catch(e){alert(e.message)}}
function render(){if(!db)return;app.innerHTML=`<header><div><h1>🐟 Sinfdoshlar</h1><div class="small">${esc(me.name)} • ${me.role==="waiter"?"Ofitsant":me.role==="admin"?"Admin":"Boshliq"}</div></div><button class="muted" onclick="logout()">Chiqish</button></header><div class="wrap">
<div class="tabs">
<button onclick="showHome()">Joylar</button><button onclick="showExternal()">Tashqi zakaz</button><button onclick="showOrders()">Zakazlar</button>${["boss","admin"].includes(me.role)?'<button onclick="showMenuAdmin()">Menyu</button><button onclick="showReports()">Hisobot</button>':""}
</div><div id="screen"></div></div>`;showHome()}
function logout(){me=null;cart=[];login()}
function showHome(){
 let places=[...db.rooms,...db.beds,db.hall];
 let html=`<div class="card"><b>Joylar holati</b><p class="small">🟢 bo‘sh • 🔴 band. Hamma telefonda avtomatik yangilanadi.</p><div class="grid">`;
 places.forEach(p=>html+=`<div class="card"><b>${esc(p.name)}</b><br><span class="pill ${p.busy?"busy":"free"}">${p.busy?"BAND":"BO‘SH"}</span><br><br><button ${p.busy?"":"onclick='openPlace("+JSON.stringify(p.id)+")'"}>${p.busy?"Hisobni ko‘rish":"Zakaz ochish"}</button></div>`);
 html+=`</div></div>`;
 if(me.role==="waiter"){let w=db.waiters?.[me.id];html+=`<div class="card"><b>Ofitsant holati</b><br><br><button onclick="setWaiter(${!w?.online})">${w?.online?"🟢 Ishda — o‘chirish":"⚪ Ishda deb belgilash"}</button></div>`}
 document.getElementById("screen").innerHTML=html;
}
function openPlace(id){selectedPlace=id;cart=[];let p=[...db.rooms,...db.beds,db.hall].find(x=>x.id===id);showOrder(p)}
function showOrder(p){
 let open=db.orders.filter(o=>o.placeId===p.id&&o.status==="open");
 let existing=open.length>0;
 let html=`<div class="card"><h2>${esc(p.name)}</h2>${existing?`<div class="notice">Bu joyda ochiq hisob bor. Bu zakaz <b>qo‘shimcha zakaz</b> bo‘ladi — 10% xizmat haqi qo‘shilmaydi.</div>`:"<div class='notice'>Bu birinchi zakaz. Jami taomlar qiymatiga 10% xizmat haqi qo‘shiladi.</div>"}<div class="tabs">${["Baliq","Shashlik","Taom","Ichimlik","Qo‘shimcha"].map(c=>`<button class="${cat===c?"":"muted"}" onclick='cat=${JSON.stringify(c)};showOrder(${JSON.stringify(p)})'>${c}</button>`).join("")}</div>`;
 db.menu.filter(m=>m.cat===cat).forEach(m=>{
  let canKg=m.perKg;
  html+=`<div class="item"><div><b>${esc(m.name)}</b><br><span class="small">${money(m.price)} ${m.perKg?"/ kg":""}</span></div><div>${canKg?`<button onclick='addFish(${JSON.stringify(m.id)})'>Kg kiritish</button>`:`<button onclick='addItem(${JSON.stringify(m.id)})'>+</button>`}</div></div>`
 });
 html+=`<hr><div id="cart">${cart.length?cart.map((x,i)=>`<div class="item"><div>${esc(x.name)} ${x.perKg?`• ${x.kg} kg`:`× ${x.qty}`}<br><span class="small">${money(x.total)}</span></div><button class="danger" onclick="cart.splice(${i},1);showOrder(${JSON.stringify(p)})">×</button></div>`).join(""):"<p class='small'>Zakaz hali bo‘sh.</p>"}</div>`;
 html+=`<div class="total">Jami: ${money(cart.reduce((s,x)=>s+x.total,0))}</div><br><button style="width:100%" onclick="sendOrder(${JSON.stringify(p)})" ${cart.length?"":"disabled"}>Zakazni yuborish</button>`;
 if(existing) html+=`<br><br><button class="muted" style="width:100%" onclick="showReceipt(${JSON.stringify(p.id)})">🧾 Hisob / chek</button>`;
 html+=`</div>`;document.getElementById("screen").innerHTML=html;
}
async function addFish(id){
 if(!["boss","admin"].includes(me.role)){alert("Baliq og‘irligini faqat Boshliq/Admin kiritadi.");return}
 let m=db.menu.find(x=>x.id===id), kg=prompt(m.name+" og‘irligini kiriting (kg):","1");
 kg=Number(kg); if(!(kg>0))return;
 cart.push({menuId:m.id,name:m.name,kg,unitPrice:m.price,total:kg*m.price,perKg:true});showOrder([...db.rooms,...db.beds,db.hall].find(x=>x.id===selectedPlace))
}
function addItem(id){let m=db.menu.find(x=>x.id===id),x=cart.find(x=>x.menuId===id&&!x.perKg);if(x){x.qty++;x.total=x.qty*m.price}else cart.push({menuId:id,name:m.name,qty:1,unitPrice:m.price,total:m.price});showOrder([...db.rooms,...db.beds,db.hall].find(x=>x.id===selectedPlace))}
async function sendOrder(p){try{await api("/api/order",{user:me,placeId:p.id,placeName:p.name,items:cart});cart=[];alert("Zakaz saqlandi");showHome()}catch(e){alert(e.message)}}
function showReceipt(placeId){
 let p=[...db.rooms,...db.beds,db.hall].find(x=>x.id===placeId), os=db.orders.filter(o=>o.placeId===placeId&&o.status==="open"), sub=os.reduce((s,o)=>s+o.items.reduce((a,x)=>a+x.total,0),0), fee=os.reduce((s,o)=>s+o.serviceFee,0), total=sub+fee;
 document.getElementById("screen").innerHTML=`<div class="card" id="receipt"><h2>🐟 SINFDOSHLAR</h2><h3>${esc(p.name)}</h3>${os.map(o=>`<div><b>${o.id}</b> • ${esc(o.userName)}<br>${o.items.map(x=>`${esc(x.name)} ${x.perKg?x.kg+" kg × "+money(x.unitPrice):"×"+x.qty+" × "+money(x.unitPrice)} = <b>${money(x.total)}</b>`).join("<br>")}<br><small>${new Date(o.createdAt).toLocaleString()}</small></div><hr>`).join("")}<div>Taomlar: <b>${money(sub)}</b></div><div>Xizmat haqi (10% faqat birinchi zakaz): <b>${money(fee)}</b></div><div class="total">JAMI: ${money(total)}</div><br><button onclick="window.print()">🖨️ Chop etish</button><br><br><button onclick="payPlace(${JSON.stringify(placeId)})">💵 Hisobni yopish</button></div>`
}
async function payPlace(id){if(!confirm("Hisob to‘landi va yopilsinmi?"))return;try{await api("/api/close",{user:me,placeId:id});showHome()}catch(e){alert(e.message)}}
function showExternal(){
 cart=[];document.getElementById("screen").innerHTML=`<div class="card"><h2>📦 Tashqi zakaz</h2><input id="cn" placeholder="Mijoz ismi"><br><br><input id="cp" inputmode="tel" placeholder="Telefon (ixtiyoriy)"><h3>Menyu</h3>${db.menu.filter(m=>!m.perKg).map(m=>`<div class="item"><span>${esc(m.name)}<br><b>${money(m.price)}</b></span><button onclick='addExt(${JSON.stringify(m.id)})'>+</button></div>`).join("")}<hr><div id="extcart"></div><div class="total" id="exttotal">Jami: 0 so‘m</div><br><button style="width:100%" onclick="sendExternal()">EXT zakazni saqlash</button></div>`}
function addExt(id){let m=db.menu.find(x=>x.id===id),x=cart.find(x=>x.menuId===id);if(x){x.qty++;x.total=x.qty*m.price}else cart.push({menuId:id,name:m.name,qty:1,unitPrice:m.price,total:m.price});document.getElementById("extcart").innerHTML=cart.map((x,i)=>`<div class="item">${esc(x.name)} × ${x.qty} = ${money(x.total)} <button class="danger" onclick="cart.splice(${i},1);showExternal()">×</button></div>`).join("");document.getElementById("exttotal").textContent="Jami: "+money(cart.reduce((s,x)=>s+x.total,0))}
async function sendExternal(){try{let o=await api("/api/external",{user:me,customerName:document.getElementById("cn").value,phone:document.getElementById("cp").value,items:cart});alert(o.id+" saqlandi");cart=[];showExternal()}catch(e){alert(e.message)}}
function showOrders(){let all=[...db.orders.map(o=>({...o,type:"room"})),...db.external.map(o=>({...o,type:"external"}))].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));document.getElementById("screen").innerHTML=`<div class="card"><h2>📋 Zakazlar</h2>${all.map(o=>`<div class="item"><div><b>${o.id}</b> ${esc(o.placeName||o.customerName)}<br>${money(o.total??(o.items||[]).reduce((s,x)=>s+x.total,0)+(o.serviceFee||0))}<br><span class="small">${new Date(o.createdAt).toLocaleString()} • ${esc(o.userName)}</span></div>${["boss","admin"].includes(me.role)?`<button class="danger" onclick='delOrder(${JSON.stringify(o.id)},${JSON.stringify(o.type)})'>O‘chirish</button>`:""}</div>`).join("")||"<p>Zakaz yo‘q</p>"}</div>`}
async function delOrder(id,type){if(!confirm("Zakaz o‘chirilsinmi?"))return;try{await api("/api/delete",{user:me,id,type});showOrders()}catch(e){alert(e.message)}}
function showMenuAdmin(){document.getElementById("screen").innerHTML=`<div class="card"><h2>⚙️ Menyu boshqaruvi</h2><p class="small">Yangi mahsulot qo‘shish mumkin.</p><input id="mn" placeholder="Mahsulot nomi"><br><br><input id="mp" type="number" placeholder="Narxi"><br><br><select id="mc"><option>Baliq</option><option>Shashlik</option><option>Taom</option><option>Ichimlik</option><option>Qo‘shimcha</option><option>Boshqa</option></select><br><br><label><input id="mkg" type="checkbox"> 1 kg bo‘yicha</label><br><br><button onclick="addMenu()">Qo‘shish</button></div><div class="card">${db.menu.map(m=>`<div class="item"><span>${esc(m.name)}<br>${money(m.price)} ${m.perKg?"/ kg":""}</span><button class="danger" onclick='deleteMenu(${JSON.stringify(m.id)})'>×</button></div>`).join("")}</div>`}
async function addMenu(){try{await api("/api/menu",{user:me,action:"add",item:{name:document.getElementById("mn").value,price:document.getElementById("mp").value,cat:document.getElementById("mc").value,perKg:document.getElementById("mkg").checked}});showMenuAdmin()}catch(e){alert(e.message)}}
async function deleteMenu(id){if(!confirm("Menyu o‘chirilsinmi?"))return;try{await api("/api/menu",{user:me,action:"delete",item:{id}});showMenuAdmin()}catch(e){alert(e.message)}}
function showReports(){let paid=db.orders.filter(o=>o.status==="paid"),sum=paid.reduce((s,o)=>s+o.items.reduce((a,x)=>a+x.total,0)+(o.serviceFee||0),0),ext=db.external.reduce((s,o)=>s+o.total,0);document.getElementById("screen").innerHTML=`<div class="card"><h2>📊 Hisobot</h2><p>Yopilgan xona/joy hisoblari: <b>${paid.length}</b></p><p>Yopilgan hisoblar summasi: <b>${money(sum)}</b></p><p>Tashqi zakazlar: <b>${db.external.length}</b></p><p>Tashqi zakazlar jami: <b>${money(ext)}</b></p><p>Umumiy ko‘rsatilgan tushum: <b>${money(sum+ext)}</b></p></div>`}
async function setWaiter(online){try{await api("/api/waiter-status",{user:me,online});showHome()}catch(e){alert(e.message)}}
const socket=io();socket.on("state",s=>{db=s;if(me&&document.getElementById("screen")){ /* preserve current screen until user acts */ }});
fetch("/api/bootstrap").then(r=>r.json()).then(x=>{db={...x,orders:[],external:[],seq:1,extSeq:1,waiters:{}};fetch("/api/state").then(r=>r.json()).then(s=>{db=s;if(me)render()})});
login();
</script>
</body>
</html>
